[package]
name = "cxa"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Codex account switching and remaining quota for ChatGPT and CLIProxyAPI"
repository = "https://github.com/jievince/cxa"
homepage = "https://github.com/jievince/cxa"
readme = "README.md"
keywords = ["codex", "oauth", "cli", "accounts", "api-key"]
categories = ["command-line-utilities", "authentication"]
publish = false
default-run = "cxa"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cxa"
path = "src/bin/cxa.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
libc = "0.2.183"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt", "time", "macros"] }
toml_edit = { version = "0.22", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
